<html>
<head>
    <title>LakeMover Assessment Report</title>
</head>

<body>

<h1>LakeMover Assessment Report</h1>

<h2>Migration Readiness Score</h2>

<h3>{{ readiness_score }}%</h3>

<h2>Findings</h2>

<table border="1" cellpadding="5">

<tr>
    <th>Severity</th>
    <th>Issue</th>
    <th>Recommendation</th>
</tr>

{% for finding in findings %}

<tr>
    <td>{{ finding.severity }}</td>
    <td>{{ finding.issue }}</td>
    <td>{{ finding.recommendation }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
